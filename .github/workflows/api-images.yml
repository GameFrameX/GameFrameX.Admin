# =============================================================================
# 三镜像（admin-web-api / admin-client-api / admin-hub-api）统一构建，双仓库推送（2026-11-02 起）：
#   ghcr.io                 —— 开源分发渠道；GITHUB_TOKEN 登录，无 secrets 也推送（fork 可用）
#   CNB_REGISTRY secrets —— 国内部署源（docker.cnb.cool，国内服务器拉取不受限）
# 推送后 HTTP POST 触发服务器 deploy API，从 DEPLOY 仓库 pull 并重建容器。
# 触发规则与 CNB 版对齐：
#   main push / v* tag → 并发构建三镜像，main 与 tag 额外推 latest 并触发自动部署
# 路径过滤：仅后端目录或本文件变更触发，前端改动不再误触后端部署。
#
# 所需 GitHub Secrets（值拷贝自 cnb.cool/GameFrameX/Admin/cnb-shared-config envs.yml）：
#   CNB_REGISTRY（值 = docker.cnb.cool）/ CNB_REGISTRY_USERNAME / CNB_REGISTRY_PASSWORD / CNB_API_IMAGE_NAMESPACE
#   DEPLOY_API_URL / DEPLOY_AUTH_USERNAME / DEPLOY_AUTH_PASSWORD / DEPLOY_AUTH_REGISTRY /
#   DEPLOY_AUTH_EMAIL / DEPLOY_NETWORK_NAME / DEPLOY_NETWORK_GATEWAY
#   DEPLOY_WEB_{CONTAINER_NAME,IP_ADDRESS,PORTS,VOLUMES,ENVIRONMENTS}
#   DEPLOY_CLIENT_{CONTAINER_NAME,IP_ADDRESS,PORTS,VOLUMES,ENVIRONMENTS}
#   DEPLOY_HUB_{CONTAINER_NAME,IP_ADDRESS,PORTS,VOLUMES,ENVIRONMENTS}
# Secrets 未配置时：跳过 DEPLOY 仓库登录/推送/部署（构建与 ghcr.io 推送仍执行）。
# =============================================================================

on:
  push:
    branches: [main]
    paths:
      - 'GameFrameX.Admin.Unified.Api/**'
      - '.github/workflows/api-images.yml'
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: admin-web-api
            dockerfile: Dockerfile.web-api
            deploy-script: deploy-web-api.sh
          - image: admin-client-api
            dockerfile: Dockerfile.client-api
            deploy-script: deploy-client-api.sh
          - image: admin-hub-api
            dockerfile: Dockerfile.hub-api
            deploy-script: deploy-hub-api.sh
    defaults:
      run:
        working-directory: GameFrameX.Admin.Unified.Api
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: resolve
        env:
          CNB_REGISTRY: ${{ secrets.CNB_REGISTRY }}
          CNB_API_IMAGE_NAMESPACE: ${{ secrets.CNB_API_IMAGE_NAMESPACE }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${GITHUB_SHA::7}"
          fi
          # 开源分发镜像：ghcr.io/<owner 小写>/<镜像名>（GITHUB_TOKEN 恒可推送）
          echo "ghcr_image_tag=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}:${TAG}" >> "$GITHUB_OUTPUT"
          # 国内部署镜像：CNB 组 secrets 齐全才输出；否则留空，
          # 后续 login 步骤同步跳过 CNB 仓库推送与自动部署。
          if [[ -n "${CNB_REGISTRY:-}" && -n "${CNB_API_IMAGE_NAMESPACE:-}" ]]; then
            echo "image_tag=${CNB_REGISTRY}/${CNB_API_IMAGE_NAMESPACE}/${{ matrix.image }}:${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=" >> "$GITHUB_OUTPUT"
            echo "[SKIP] CNB_REGISTRY/CNB_API_IMAGE_NAMESPACE 未配置，仅构建 + 推送 ghcr.io"
          fi

      - name: Docker login (ghcr.io)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Docker login (deploy registry)
        id: login
        env:
          CNB_REGISTRY: ${{ secrets.CNB_REGISTRY }}
          CNB_REGISTRY_USERNAME: ${{ secrets.CNB_REGISTRY_USERNAME }}
          CNB_REGISTRY_PASSWORD: ${{ secrets.CNB_REGISTRY_PASSWORD }}
        run: |
          if [ -z "$CNB_REGISTRY_USERNAME" ] || [ -z "$CNB_REGISTRY" ]; then
            echo "logged=false" >> "$GITHUB_OUTPUT"
            echo "[SKIP] CNB_REGISTRY_USERNAME/CNB_REGISTRY 未配置，跳过 CNB 仓库推送与部署"
            exit 0
          fi
          echo "$CNB_REGISTRY_PASSWORD" | docker login "$CNB_REGISTRY" -u "$CNB_REGISTRY_USERNAME" --password-stdin
          echo "logged=true" >> "$GITHUB_OUTPUT"

      - name: Build image
        env:
          GHCR_IMAGE_TAG: ${{ steps.resolve.outputs.ghcr_image_tag }}
          IMAGE_TAG: ${{ steps.resolve.outputs.image_tag }}
        run: |
          TAGS=(-t "$GHCR_IMAGE_TAG")
          if [ -n "$IMAGE_TAG" ]; then TAGS+=(-t "$IMAGE_TAG"); fi
          docker build "${TAGS[@]}" -f ${{ matrix.dockerfile }} .

      - name: Push image (ghcr.io, commit hash + latest)
        env:
          GHCR_IMAGE_TAG: ${{ steps.resolve.outputs.ghcr_image_tag }}
        run: |
          docker push "$GHCR_IMAGE_TAG"
          docker tag "$GHCR_IMAGE_TAG" "${GHCR_IMAGE_TAG%:*}:latest"
          docker push "${GHCR_IMAGE_TAG%:*}:latest"

      - name: Push image (deploy registry, commit hash)
        if: steps.login.outputs.logged == 'true'
        env:
          IMAGE_TAG: ${{ steps.resolve.outputs.image_tag }}
        run: docker push "$IMAGE_TAG"

      - name: Push latest (deploy registry) + deploy
        if: steps.login.outputs.logged == 'true'
        env:
          IMAGE_TAG: ${{ steps.resolve.outputs.image_tag }}
          DEPLOY_API_URL: ${{ secrets.DEPLOY_API_URL }}
          DEPLOY_AUTH_USERNAME: ${{ secrets.DEPLOY_AUTH_USERNAME }}
          DEPLOY_AUTH_PASSWORD: ${{ secrets.DEPLOY_AUTH_PASSWORD }}
          DEPLOY_AUTH_REGISTRY: ${{ secrets.DEPLOY_AUTH_REGISTRY }}
          DEPLOY_AUTH_EMAIL: ${{ secrets.DEPLOY_AUTH_EMAIL }}
          DEPLOY_NETWORK_NAME: ${{ secrets.DEPLOY_NETWORK_NAME }}
          DEPLOY_NETWORK_GATEWAY: ${{ secrets.DEPLOY_NETWORK_GATEWAY }}
          DEPLOY_WEB_CONTAINER_NAME: ${{ secrets.DEPLOY_WEB_CONTAINER_NAME }}
          DEPLOY_WEB_IP_ADDRESS: ${{ secrets.DEPLOY_WEB_IP_ADDRESS }}
          DEPLOY_WEB_PORTS: ${{ secrets.DEPLOY_WEB_PORTS }}
          DEPLOY_WEB_VOLUMES: ${{ secrets.DEPLOY_WEB_VOLUMES }}
          DEPLOY_WEB_ENVIRONMENTS: ${{ secrets.DEPLOY_WEB_ENVIRONMENTS }}
          DEPLOY_CLIENT_CONTAINER_NAME: ${{ secrets.DEPLOY_CLIENT_CONTAINER_NAME }}
          DEPLOY_CLIENT_IP_ADDRESS: ${{ secrets.DEPLOY_CLIENT_IP_ADDRESS }}
          DEPLOY_CLIENT_PORTS: ${{ secrets.DEPLOY_CLIENT_PORTS }}
          DEPLOY_CLIENT_VOLUMES: ${{ secrets.DEPLOY_CLIENT_VOLUMES }}
          DEPLOY_CLIENT_ENVIRONMENTS: ${{ secrets.DEPLOY_CLIENT_ENVIRONMENTS }}
          DEPLOY_HUB_CONTAINER_NAME: ${{ secrets.DEPLOY_HUB_CONTAINER_NAME }}
          DEPLOY_HUB_IP_ADDRESS: ${{ secrets.DEPLOY_HUB_IP_ADDRESS }}
          DEPLOY_HUB_PORTS: ${{ secrets.DEPLOY_HUB_PORTS }}
          DEPLOY_HUB_VOLUMES: ${{ secrets.DEPLOY_HUB_VOLUMES }}
          DEPLOY_HUB_ENVIRONMENTS: ${{ secrets.DEPLOY_HUB_ENVIRONMENTS }}
        working-directory: .
        run: |
          docker tag "$IMAGE_TAG" "${IMAGE_TAG%:*}:latest"
          docker push "${IMAGE_TAG%:*}:latest"
          bash build/${{ matrix.deploy-script }}
